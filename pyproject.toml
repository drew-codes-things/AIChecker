[project]
name = "ai-checker"
dynamic = ["version"]
description = "Self-hosted AI-writing checker and Humaniser"
requires-python = ">=3.11"

[tool.setuptools.dynamic]
version = { attr = "aichecker.__version__" }

[tool.setuptools.packages.find]
include = ["aichecker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
